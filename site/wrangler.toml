# Why: the Pages project needs three bindings and nothing else: the audio bucket, Workers AI for
# transcription, and one secret for the GitHub dispatch that turns a transcript into a pull request.
name = "agentic-blog"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "agentic-blog-audio"

[ai]
binding = "AI"

[vars]
GITHUB_REPO = "victorsaly/agentic-blog"
# GITHUB_TOKEN is a secret: `wrangler pages secret put GITHUB_TOKEN` (fine-grained, contents: write, on this repo only)
