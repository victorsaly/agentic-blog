# Site settings. Every agent and the site read this file. Change it in a pull request like anything else.
# why: the blogger is a parameter, not a hard-coded name. Everything that is "about Victor" lives here and in profile.md.

site:
  name: Victor Saly
  domain: blog.victorsaly.com
  tagline: Talked out loud, tidied by AI
  author: Victor Saly
  email: info@victorsaly.com
  linkedin: https://www.linkedin.com/in/victorsaly # in the footer, and tells search engines the profile is the author's
  timezone: Europe/London

languages:
  origin: en # the language most origins come out in
  publish: [en] # add a code here and the convert agent produces that version; a folder appears on the site

themes: # the ring around the core; one idea can carry several
  - ai-changing-work
  - accountability
  - credibility
  - scalable-secure
  - apps-and-workflows

topics: # one plain line per theme, shown on the Topics page and on each topic's page; Victor's words win
  ai-changing-work: How AI is changing the work we do, and who still makes the call.
  accountability: Who answers for the work when a machine helped to make it.
  credibility: What makes people believe what you say, and what you ship.
  scalable-secure: Building systems that grow without breaking and keep people's data safe.
  apps-and-workflows: The apps and the small workflows that get real work done.

depths: # the three reading depths, in order
  - message
  - idea
  - road

publishing:
  index: true # robots: search engines welcome; also opens the reader chat (false keeps both closed)
  badge_text: Talked out loud, tidied by AI # printed on LinkedIn posts, beside the link
  social: [linkedin] # which short versions the publish agent prepares
  # What readers see costs in. Providers bill, and the ledger records, in US dollars; the page converts at
  # this fixed rate so a cost reads the same on every deploy. Update the rate and the date together.
  currency:
    show: GBP
    per_usd: 0.748 # pounds to one US dollar, ECB reference rates of 23 October 2026 (0.83728 / 1.1193)
    rate_date: 2026-10-23

licence:
  code: MIT
  content: all-rights-reserved # change when chosen, e.g. CC-BY-4.0

media:
  audio_bucket: agentic-blog-audio # R2 bucket, bound as AUDIO in site/wrangler.toml
  image_style: >
    A linocut print: bold carved black shapes and white cut lines, strong contrast, hand-printed texture,
    only black and white, no grey, no text. One idea per picture. Generous empty space.
  # The blogger, Victor, drawn on each post's cover; the section panels draw the ideas, not him.
  image_character: >
    Victor: a man with short dark hair swept up at the front, light stubble along the jaw, round glasses
    and a warm, wide smile. Dressed simply, a dark jacket or jumper over a shirt. Always the same man,
    drawn the same way.
  # A photo of Victor the image agent draws from, kept on Victor's machine only (.private/ is git-ignored;
  # the repo is public). Without it, the description above is all the agent has.
  image_reference: .private/reference/victor.png
  # The ElevenLabs voice the voice agent reads the short version in: Victor's own, cloned in ElevenLabs.
  # null means Chris W. Changing it reads every post again, and each new recording waits for review.
  voice_id: eHHUhFBxuo0yMYCOGHks
  voice_name: Victor Saly # what the post's Listen row calls the voice
  voice_speed: 1.1 # played this much quicker than spoken (0.8–1.25); eleven_v3 ignores ElevenLabs' own speed

agents:
  model: claude-sonnet-5-5 # reasoning agents; override per agent in its PROMPT.md front matter
  max_output_tokens: 4000
  review_required: true # never false
