# Why: agents live where the content lives. Add the label `agent:<name>` to a pull request (or run the
# workflow by hand with a thought slug) and that one agent runs on that one thought, writing its files to
# the branch so the pull request shows the diff. Nothing merges by itself; a held result fails the check.
name: Agents
# Names every run "agent:<name> · <thought or branch>", so the studio's Agents area can say which agent
# worked on which thought without opening the run.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('agent:{0} · {1}', inputs.agent, inputs.thought)
  || format('{0} · {1}', github.event.label.name, github.head_ref) }}

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent
        required: true
        type: choice
        options:
          [
            interview,
            structure,
            convert,
            image,
            diagram,
            citations,
            drilldown,
            profile,
            feedback,
            safety,
            security,
            seo,
            voice,
            publish,
          ]
      thought:
        description: Thought folder, e.g. 2026-10-23-talked-out-loud-tidied-by-ai
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# One agent at a time on a pull request, so two labels never race to push to the same branch.
concurrency:
  group: agents-${{ github.event.pull_request.number || inputs.thought }}
  cancel-in-progress: false
  queue: max

jobs:
  run:
    name: Run one agent on one thought
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'agent:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          # The full history, so main is there to diff against when working out the thought.
          fetch-depth: 0
          # Pushes made with GitHub's own token never start CI, so the pull request would show checks from
          # before the agent wrote anything. BOT_TOKEN pushes as a person; without it, the old behaviour.
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund

      - name: Work out the agent and the thought
        id: pick
        env:
          LABEL: ${{ github.event.label.name }}
          INPUT_AGENT: ${{ github.event.inputs.agent }}
          INPUT_THOUGHT: ${{ github.event.inputs.thought }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$INPUT_AGENT" ]; then
            echo "agent=$INPUT_AGENT" >> "$GITHUB_OUTPUT"
            echo "thought=$INPUT_THOUGHT" >> "$GITHUB_OUTPUT"
          else
            echo "agent=${LABEL#agent:}" >> "$GITHUB_OUTPUT"
            # origin/<slug> and feedback/<slug>-<stamp> branches name the thought
            slug=$(git diff --name-only origin/main...HEAD -- thoughts | awk -F/ '{print $2}' | sort -u | head -1)
            echo "thought=$slug" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # image only. OpenAI draws when its key is set; otherwise Workers AI with the Cloudflare token.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          # voice only. ElevenLabs reads the short version aloud and times every word.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # The studio shows the run while it happens. Without these three, the run goes on and sends nothing.
          STUDIO_URL: ${{ vars.STUDIO_URL }}
          STUDIO_ACCESS_CLIENT_ID: ${{ secrets.STUDIO_ACCESS_CLIENT_ID }}
          STUDIO_ACCESS_CLIENT_SECRET: ${{ secrets.STUDIO_ACCESS_CLIENT_SECRET }}
          AGENT: ${{ steps.pick.outputs.agent }}
          THOUGHT: ${{ steps.pick.outputs.thought }}
        run: |
          set +e
          out=$(npm run agent --silent -- "$AGENT" "$THOUGHT")
          code=$?
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The step always passes so the ledger is committed below; a failed or held run fails the job after.

      # The runner wrote this run to thoughts/<slug>/ledger/<run>.jsonl and <run>.head; they go in the same
      # commit as the agent's files, so the pull request shows the record beside the change. A run that
      # failed (any code but 0 done and 3 held) commits only its ledger, so the failure and its cost are kept
      # and nothing half-written lands.
      - name: Commit what the agent wrote, and its ledger
        env:
          CODE: ${{ steps.agent.outputs.code }}
          AGENT: ${{ steps.pick.outputs.agent }}
          THOUGHT: ${{ steps.pick.outputs.thought }}
          # Through the environment, never pasted into the script: it carries the model's own words.
          RESULT: ${{ steps.agent.outputs.result }}
        run: |
          git config user.name "agentic-blog[bot]"
          git config user.email "agentic-blog[bot]@users.noreply.github.com"
          if [ "$CODE" = "0" ] || [ "$CODE" = "3" ]; then
            git add -A thoughts wiki profile.md
            title="agent($AGENT): $THOUGHT"
          else
            # A run that stopped before it started (a bad ledger, a model with no price) has no ledger file.
            if [ -d "thoughts/$THOUGHT/ledger" ]; then git add -A "thoughts/$THOUGHT/ledger"; fi
            title="agent($AGENT): $THOUGHT failed (exit $CODE), ledger only"
          fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "$title" -m "$RESULT"
          git push

      - name: Remove the trigger label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "${{ github.event.label.name }}"

      - name: Hold the post if the agent said so
        if: steps.agent.outputs.code == '3'
        run: |
          echo "::error::The ${{ steps.pick.outputs.agent }} agent held this post. Read its file in the pull request before merging."
          exit 1

      - name: Fail if the agent failed
        if: steps.agent.outputs.code != '0' && steps.agent.outputs.code != '3'
        run: |
          echo "::error::The ${{ steps.pick.outputs.agent }} agent exited ${{ steps.agent.outputs.code }}. Its ledger records why."
          exit 1
