# Why: formatting is a machine's job. Run this by hand and prettier's changes land on main as one commit,
# so nobody argues about spaces and the lint check stays green.
name: Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run format
      - name: Commit the result
        run: |
          git config user.name "agentic-blog[bot]"
          git config user.email "agentic-blog[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to format"; exit 0; fi
          git commit -m "style: prettier" -m "Run from .github/workflows/format.yml."
          git push
