# Why: formatting is a machine's job. Run this by hand on a pull request's branch and prettier's changes land
# on that branch as one commit, so nobody argues about spaces and the lint check goes green. main only changes
# through a pull request, so it refuses to run there.
name: Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit the result
        run: |
          git config user.name "agentic-blog[bot]"
          git config user.email "agentic-blog[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to format"; exit 0; fi
          git commit -m "style: prettier" -m "Run from .github/workflows/format.yml."
          git push
