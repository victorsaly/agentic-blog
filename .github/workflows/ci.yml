# Why: every pull request is held to the same gate: every file has a why, the code passes lint, types and
# tests, the site builds, and every page passes an accessibility check. Nothing merges on a red run. On main
# the same run then deploys the site it built and checked, so nothing reaches readers without passing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run; on main every run finishes, so a deploy is never
# cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Why, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Every file says why it exists
        run: node scripts/ci-annotate.mjs why npm run check:why
      - name: Agent cards match their prompts
        run: node scripts/ci-annotate.mjs cards npm run roadbook --silent -- check-cards
      - name: Every ledger verifies against its head
        run: node scripts/ci-annotate.mjs ledgers npm run roadbook --silent -- verify-ledgers
      # Each run keeps its own ledger file, so a pull request only ever adds runs. One that changes or removes
      # a run already on the base branch is rewriting the record and fails here.
      - name: Merged ledger runs are never changed or removed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only --diff-filter=DMRT FETCH_HEAD HEAD -- 'thoughts/*/ledger/*')
          if [ -n "$changed" ]; then
            while read -r f; do echo "::error file=$f::A merged ledger run was changed or removed."; done <<< "$changed"
            echo "Fix: restore these from $BASE; to correct an event, record a correction in a new run."
            exit 1
          fi
          echo "No merged ledger run was touched."
      - name: Lint and format
        id: lint
        run: node scripts/ci-annotate.mjs lint npm run lint
      # Prints the patch prettier wants, so a failing lint can be fixed from anywhere (even a phone).
      - name: What prettier would change
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          npm run format --silent || true
          git --no-pager diff
      - name: Types
        run: node scripts/ci-annotate.mjs types npm run typecheck
      - name: Tests
        run: node scripts/ci-annotate.mjs tests npm run test -- --reporter=dot
      - name: Roadbook (every accountability rule holds, and what the project will do)
        run: node scripts/ci-annotate.mjs roadbook npm run roadbook --silent -- plan
      - name: Build the site
        run: node scripts/ci-annotate.mjs build npm run build --workspace site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          # dist/.assetsignore keeps the worker code out of the public assets; without it the deploy would serve it.
          include-hidden-files: true
          retention-days: 7

  accessibility:
    name: Accessibility (axe on every page)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Serve and audit
        run: |
          npx --yes serve@14 site/dist -l 4321 -s &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/ && break
            sleep 1
          done
          node scripts/ci-annotate.mjs axe node scripts/axe.mjs http://localhost:4321

  deploy:
    name: Deploy the Worker
    needs: [check, accessibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The exact site the checks passed, not a fresh build.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
