# Why: every pull request is held to the same gate: every file has a why, the code passes lint, types and
# tests, the site builds, and every page passes an accessibility check. Nothing merges on a red run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Why, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Every file says why it exists
        run: node scripts/ci-annotate.mjs why npm run check:why
      - name: Lint and format
        run: node scripts/ci-annotate.mjs lint npm run lint
      - name: Types
        run: node scripts/ci-annotate.mjs types npm run typecheck
      - name: Tests
        run: node scripts/ci-annotate.mjs tests npm run test -- --reporter=dot
      - name: Roadbook (every accountability rule holds, and what the project will do)
        run: node scripts/ci-annotate.mjs roadbook npm run roadbook --silent -- plan
      - name: Build the site
        run: node scripts/ci-annotate.mjs build npm run build --workspace site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  accessibility:
    name: Accessibility (axe on every page)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Serve and audit
        run: |
          npx --yes serve@14 site/dist -l 4321 -s &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/ && break
            sleep 1
          done
          node scripts/ci-annotate.mjs axe node scripts/axe.mjs http://localhost:4321

  format-patch:
    name: Formatting diff (for fixing from anywhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: What prettier would change
        run: |
          npm run format --silent || true
          git --no-pager diff > format.patch || true
          if [ -s format.patch ]; then
            echo "::group::format.patch"; cat format.patch; echo "::endgroup::"
            echo "::warning::prettier wants changes; see format.patch in the log"
          else
            echo "nothing to format"
          fi
